# Remote control requires enzUI consent; GTK handles unsupported interfaces.
# The enzUI Settings backend owns color-scheme only; other settings fall through.
[preferred]
default=hyprland;gtk;
org.freedesktop.impl.portal.FileChooser=enzui;gtk;
org.freedesktop.impl.portal.Access=enzui;gtk;
org.freedesktop.impl.portal.Settings=enzui;gtk;
# The installed session starts generated XDG autostart entries.
org.freedesktop.impl.portal.Background=enzui;
org.freedesktop.impl.portal.ScreenCast=enzui-remote;hyprland;
org.freedesktop.impl.portal.RemoteDesktop=enzui-remote;
org.freedesktop.impl.portal.Screenshot=hyprland;
org.freedesktop.impl.portal.GlobalShortcuts=hyprland;
org.freedesktop.impl.portal.Print=gtk;
org.freedesktop.impl.portal.Secret=oo7-portal;
