<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Any caller may ask; the helper itself grants only the active local session (polkit). -->
<busconfig>
  <policy user="root">
    <allow own="dev.enzui.PowerBoost1"/>
  </policy>
  <policy context="default">
    <allow send_destination="dev.enzui.PowerBoost1" send_interface="dev.enzui.PowerBoost1"/>
    <allow send_destination="dev.enzui.PowerBoost1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="dev.enzui.PowerBoost1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
