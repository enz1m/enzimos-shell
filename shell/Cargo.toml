[package]
name = "enzui-shell"
default-run = "enzui-shell"
version = "0.1.0"
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
publish.workspace = true

[features]
x11 = ["iced/x11", "enzui-widgets/x11"]
# Dev-only NDJSON frame timing: ENZUI_FRAME_REPORT or the runtime default, refreshed each second.
frame-report = ["iced/performance-observer"]

[dependencies]
enzimos-phone-client = { path = "../vendor/phone-link/crates/host-client" }
evdev = { version = "=0.13.2", features = ["tokio"] }
iced = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4", features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "tokio", "advanced", "svg", "a11y", "sysinfo"], default-features = false }
iced_runtime = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4" }
enzui-security = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-core = { features = ["accesskit", "activation-native-iced"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-icons = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-widgets = { features = ["portal-dbus"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-agent = { features = ["iced-consumer"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-activity = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-agent-app = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ttf-parser = "=0.25.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
libc = "0.2"
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "pipe", "process", "stdio"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "time", "fs", "net", "io-util", "sync", "macros", "signal"] }
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop"] }
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-scanner = "=0.31.11"
wayland-backend = "=0.3.15"
raster = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

tempfile = "3"

[lints]
workspace = true
