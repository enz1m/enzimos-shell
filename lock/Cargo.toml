[package]
name = "enzui-lock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
x11 = ["iced/x11", "enzui-widgets/x11", "enzui-shell/x11"]
greeter-preview = []

[[bin]]
name = "enzui-greeter-preview"
path = "src/bin/enzui-greeter-preview.rs"
required-features = ["greeter-preview"]

[dependencies]
enzui-core = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-shell = { path = "../shell" }
enzui-widgets = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
iced = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4", features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "tokio", "advanced", "image-without-codecs"], default-features = false }
iced_runtime = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4" }
iced_wgpu = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4" }
iced_tiny_skia = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4", features = ["image"] }
tiny-skia = "0.12"
resvg = { version = "=0.45.1", default-features = false }
serde_json = "1"

accesskit = { git = "https://github.com/enz1m/enzim-accesskit.git", rev = "7da7ac7b800fabf0bd2ba62eef23fa9117a684f4", version = "0.25" }
accesskit_unix = { git = "https://github.com/enz1m/enzim-accesskit.git", rev = "7da7ac7b800fabf0bd2ba62eef23fa9117a684f4", default-features = false, features = ["tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
rustix = { version = "=1.1.4", features = ["event", "fs", "pipe"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
xkbcommon-dl = "=0.4.2"
raster = { package = "image", version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
