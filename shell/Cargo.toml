[package]
name = "enzui-shell"
default-run = "enzui-shell"
version = "0.2.0"
edition.workspace = true
rust-version = "1.97.1"
license.workspace = true
publish.workspace = true

[features]
x11 = ["iced/x11", "enzui-widgets/x11", "dep:x11rb"]
# Dev-only NDJSON frame timing: ENZUI_FRAME_REPORT or the runtime default, refreshed each second.
frame-report = ["iced/performance-observer"]

# These binaries have no unit tests. The workspace lint gate checks all targets.
[[bin]]
name = "enzui-agent-consent"
path = "src/bin/enzui-agent-consent.rs"
test = false

[[bin]]
name = "enzui-agent-mock"
path = "src/bin/enzui-agent-mock.rs"
test = false

[[bin]]
name = "enzui-assistant"
path = "src/bin/enzui-assistant.rs"
test = false

[[bin]]
name = "enzui-clipboard-probe"
path = "src/bin/enzui-clipboard-probe.rs"
test = false

[[bin]]
name = "enzui-ctm-probe"
path = "src/bin/enzui-ctm-probe.rs"
test = false

[[bin]]
name = "enzui-dev-tools"
path = "src/bin/enzui-dev-tools.rs"
test = false

[[bin]]
name = "enzui-drive-unlock"
path = "src/bin/enzui-drive-unlock.rs"
test = false

[[bin]]
name = "enzui-glass-sample"
path = "src/bin/enzui-glass-sample.rs"
test = false

[[bin]]
name = "enzui-idle-inhibit"
path = "src/bin/enzui-idle-inhibit.rs"
test = false

[[bin]]
name = "enzui-keyring-prompt"
path = "src/bin/enzui-keyring-prompt.rs"
test = false

[[bin]]
name = "enzui-location-agent"
path = "src/bin/enzui-location-agent.rs"
test = false

[[bin]]
name = "enzui-maximize-preview"
path = "src/bin/enzui-maximize-preview.rs"
test = false

[[bin]]
name = "enzui-network-secrets"
path = "src/bin/enzui-network-secrets.rs"
test = false

[[bin]]
name = "enzui-notification-probe"
path = "src/bin/enzui-notification-probe.rs"
test = false

[[bin]]
name = "enzui-plugin-probe"
path = "src/bin/enzui-plugin-probe.rs"
test = false

[[bin]]
name = "enzui-search-bench"
path = "src/bin/enzui-search-bench.rs"
test = false

[[bin]]
name = "enzui-search-demo-provider"
path = "src/bin/enzui-search-demo-provider.rs"
test = false

[[bin]]
name = "enzui-search-probe"
path = "src/bin/enzui-search-probe.rs"
test = false

[[bin]]
name = "enzui-share-picker"
path = "src/bin/enzui-share-picker.rs"
test = false

[[bin]]
name = "enzui-shell-command"
path = "src/bin/enzui-shell-command.rs"
test = false

[[bin]]
name = "enzui-wallpaper"
path = "src/bin/enzui-wallpaper.rs"
test = false

[[bin]]
name = "enzui-welcome"
path = "src/bin/enzui-welcome.rs"
test = false

[dependencies]
ab_glyph = "=0.2.32"
enzimos-phone-client = { path = "../vendor/phone-link/crates/host-client" }
evdev = { version = "=0.13.2", features = ["tokio"] }
iced = { git = "https://github.com/enz1m/enzim-iced.git", rev = "58b66f27b82d30cb0fd09db524307b6a0e099279", features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "tokio", "advanced", "svg", "a11y", "sysinfo"], default-features = false }
iced_runtime = { git = "https://github.com/enz1m/enzim-iced.git", rev = "58b66f27b82d30cb0fd09db524307b6a0e099279" }
enzui-security = { git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-core = { features = ["accesskit", "activation-native-iced"], git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-clipboard = { git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-icons = { git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-widgets = { features = ["portal-dbus"], git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-agent = { features = ["iced-consumer"], git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-activity = { git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
enzui-agent-app = { git = "https://github.com/enz1m/enzui.git", rev = "46648f263fbfd31bb2a6327c4dda4845f8d5af97" }
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ttf-parser = "=0.25.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
libc = "0.2"
libloading = "0.8.9"
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "pipe", "process", "stdio"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "process", "time", "fs", "net", "io-util", "sync", "macros", "signal"] }
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop"] }
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-scanner = "=0.31.11"
x11rb = { version = "0.13.2", optional = true }
xkbcommon = { version = "=0.8.0", default-features = false }
wayland-backend = "=0.3.15"
raster = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "=0.48.1", default-features = false }

tempfile = "3"

[lints]
workspace = true
