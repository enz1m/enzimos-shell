context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Microphone Cleanup"
        audio.rate = 48000
        audio.channels = 1
        filter.graph = {
            nodes = [
                { type = builtin name = hum_100 label = bq_notch control = { Freq = 100 Q = 20 } }
                { type = builtin name = hum_400 label = bq_notch control = { Freq = 400 Q = 20 } }
                { type = ladspa name = noise label = noise_suppressor_mono plugin = librnnoise_ladspa
                  control = { "VAD Threshold (%)" = 0 "VAD Grace Period (ms)" = 200 "Retroactive VAD Grace (ms)" = 0 "Dry Mix" = 0.5 } }
                { type = builtin name = rumble label = bq_highpass control = { Freq = 90 Q = 0.707107 } }
                { type = builtin name = ceiling label = clamp control = { Min = -0.94 Max = 0.94 } }
            ]
            links = [
                { output = "hum_100:Out" input = "hum_400:In" }
                { output = "hum_400:Out" input = "noise:Input" }
                { output = "noise:Output" input = "rumble:In" }
                { output = "rumble:Out" input = "ceiling:In" }
            ]
            inputs = [ "hum_100:In" ]
            outputs = [ "ceiling:Out" ]
        }
        capture.props = {
            node.name = enzui_microphone_cleanup.capture
            node.passive = true
            audio.position = [ FL ]
        }
        playback.props = {
            node.name = enzui_microphone_cleanup
            node.virtual = true
            node.hidden = true
            media.class = Audio/Source
            priority.session = -2000
            audio.position = [ MONO ]
            filter.smart = true
        }
      }
    }
]
