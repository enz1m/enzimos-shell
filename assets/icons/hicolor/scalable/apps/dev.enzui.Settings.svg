<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Settings</title>
  <defs>
    <filter id="enz-settings-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- square keyline; panel 84 x 88 at (22 20) centred on (64 64); toggle above two sliders; knobs r 8 -->
  <g filter="url(#enz-settings-drop)">
    <rect x="22" y="20" width="84" height="88" rx="9" fill="#8E96A3"/>
  </g>
  <rect x="34" y="39" width="26" height="6" rx="3" fill="#FFFFFF"/>
  <rect x="64" y="34" width="32" height="16" rx="8" fill="#2B3140"/>
  <circle cx="88" cy="42" r="5" fill="#FFFFFF"/>
  <g fill="#5E6676">
    <rect x="34" y="63" width="62" height="6" rx="3"/>
    <rect x="34" y="87" width="62" height="6" rx="3"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="34" y="63" width="20" height="6" rx="3"/>
    <rect x="34" y="87" width="46" height="6" rx="3"/>
    <circle cx="52" cy="66" r="8"/>
    <circle cx="78" cy="90" r="8"/>
  </g>
</svg>
